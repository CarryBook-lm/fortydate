<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FortyDate — Connexion perdue</title>
    <style>
      body{margin:0;min-height:100vh;display:grid;place-items:center;padding:2rem 1.4rem;
        background:linear-gradient(160deg,#4A1546,#7A1E52);color:#fff;
        font-family:system-ui,'Segoe UI',sans-serif;text-align:center;box-sizing:border-box}
      .b{max-width:340px}
      .e{font-size:3rem;line-height:1}
      h1{font-size:1.35rem;margin:.9rem 0 .5rem}
      p{font-size:.95rem;line-height:1.6;opacity:.85;margin:0 0 1.6rem}
      button{background:#D62A5E;color:#fff;border:0;border-radius:12px;padding:.9rem 1.8rem;
        font-size:1rem;font-weight:800;cursor:pointer}
      button:active{transform:scale(.98)}
      .n{margin-top:1.4rem;font-size:.8rem;opacity:.6}
    </style>
  </head>
  <body>
    <div class="b">
      <div class="e">📡</div>
      <h1>Connexion perdue</h1>
      <p>FortyDate n'arrive pas à joindre le réseau. Vérifie ta connexion, puis réessaie.</p>
      <button onclick="location.reload()">Réessayer</button>
      <div class="n">Tes messages et tes j'aime sont bien conservés.</div>
    </div>
  </body>
</html>
